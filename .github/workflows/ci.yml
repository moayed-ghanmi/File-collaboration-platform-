name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://filecollab:filecollab@localhost:5432/filecollab?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: filecollab
          POSTGRES_PASSWORD: filecollab
          POSTGRES_DB: filecollab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filecollab"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      - run: pnpm build
