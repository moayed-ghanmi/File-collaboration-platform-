services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: filecollab
      POSTGRES_PASSWORD: filecollab
      POSTGRES_DB: filecollab
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filecollab"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage (MinIO no longer publishes public images).
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: filecollab
      RUSTFS_SECRET_KEY: filecollab-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [storagedata:/data]

  # One-shot job that creates the app bucket once storage accepts requests.
  storage-init:
    image: amazon/aws-cli:latest
    depends_on: [storage]
    environment:
      AWS_ACCESS_KEY_ID: filecollab
      AWS_SECRET_ACCESS_KEY: filecollab-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://storage:9000 s3api head-bucket --bucket filecollab 2>/dev/null && exit 0
          aws --endpoint-url http://storage:9000 s3 mb s3://filecollab && exit 0
          sleep 2
        done
        exit 1

volumes:
  pgdata:
  storagedata:
